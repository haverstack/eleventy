name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Opens or updates a "chore: version packages" PR whenever changesets
      # are pending. Merging that PR lands the version bump and CHANGELOG on
      # main. Publishing to npm is deliberate: run `pnpm run release` after
      # the merge, or add a `publish:` line here plus an NPM_TOKEN secret.
      - uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
